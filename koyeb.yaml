# ============================================================
# Optional Koyeb service manifest.
# Not required — you can configure everything in the Koyeb
# dashboard/CLI instead. Kept here for reproducible deploys via
# `koyeb app init` / `koyeb deploy`.
# ============================================================
name: prakash-tour-travels
services:
  - name: web
    type: WEB
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
    health_checks:
      - http:
          path: /
          port: 8000
    scaling:
      min: 1
      max: 1
    env:
      # Set real values in the Koyeb dashboard/CLI — do not commit secrets.
      - name: NODE_ENV
        value: production
      - name: DATABASE_URL
        secret: DATABASE_URL
      - name: ADMIN_SESSION_SECRET
        secret: ADMIN_SESSION_SECRET
      - name: RESEND_API_KEY
        secret: RESEND_API_KEY
      - name: S3_BUCKET
        secret: S3_BUCKET
      - name: S3_ACCESS_KEY_ID
        secret: S3_ACCESS_KEY_ID
      - name: S3_SECRET_ACCESS_KEY
        secret: S3_SECRET_ACCESS_KEY
